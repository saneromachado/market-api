services:
  postgres:
    image: postgres:16-alpine
    container_name: market-api-postgres
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market -d market']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - market_postgres_data:/var/lib/postgresql/data

volumes:
  market_postgres_data:
