services:
  - type: web
    name: market-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: market-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: FRONTEND_URL
        value: https://mercatto-market-web.sanerdark.chatgpt.site,https://saneromachado.github.io
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        value: admin@market.local
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: market-db
    plan: free
    region: ohio
    databaseName: market
    user: market
